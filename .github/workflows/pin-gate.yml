name: Pin Gate

# Thin caller for the org-shared Actions-pinning gate in rarebit-one/.github.
# Satisfies the org ruleset that requires `pin-check / Actions pinning gate`.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: pin-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pin-check:
    permissions:
      contents: read
    uses: rarebit-one/.github/.github/workflows/pin-check.yml@main

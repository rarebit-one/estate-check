name: estate-check
description: Lint a repo's AI-agent configuration (instruction budgets, permission bypasses, CI agent-step hygiene, MCP pinning).
author: rarebit-one
branding:
  icon: check-square
  color: blue

inputs:
  mode:
    description: "report (annotate, never fail) or enforce (fail on any error finding)"
    default: report
  path:
    description: Directory to check, relative to the workspace. Must be a git checkout.
    default: "."
  workspace:
    description: "true to check an org workspace root (tighter budgets)"
    default: "false"

runs:
  using: composite
  steps:
    - name: estate-check
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        TARGET: ${{ inputs.path }}
        WS: ${{ inputs.workspace }}
      run: |
        set -euo pipefail
        args=(--format github)
        case "$MODE" in
          report) args+=(--report) ;;
          enforce) ;;
          *) echo "::error title=estate-check::mode must be 'report' or 'enforce', got '$MODE'"; exit 2 ;;
        esac
        [[ "$WS" == "true" ]] && args+=(--workspace)
        # The sync.* rules need tomllib (Python 3.11+). Self-hosted runners don't
        # always put a new enough python3 first on PATH (a macOS runner may ship
        # 3.9), so take the first interpreter that has it.
        PY=""
        for c in python3 python3.14 python3.13 python3.12 python3.11; do
          if command -v "$c" >/dev/null 2>&1 && "$c" -c 'import tomllib' 2>/dev/null; then PY="$c"; break; fi
        done
        if [[ -z "$PY" ]]; then
          PY=python3
          echo "::warning title=estate-check::no Python 3.11+ on this runner; the sync.* rules report sync.spec instead of checking"
        fi
        "$PY" "$GITHUB_ACTION_PATH/estate-check.py" "${args[@]}" "$TARGET"
